name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build HawareEats Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔍 Analyze Dart Code
        run: flutter analyze || true

      - name: 🏗️ Build Android APK
        run: flutter build apk --release --split-per-abi

      - name: 🏗️ Build Universal Android APK
        run: flutter build apk --release

      - name: 📤 Upload Universal Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HawareEats-Release-Universal-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: 📤 Upload Split ABI Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: HawareEats-Split-APKs
          path: build/app/outputs/flutter-apk/app-*-release.apk
